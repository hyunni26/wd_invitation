      <circle cx="-10" cy="0" r="12" fill="#f3dde4"/>
      <circle cx="10" cy="0" r="12" fill="#e8b9c4"/>
      <circle cx="0" cy="-14" r="12" fill="#ece3f2"/>
      <circle cx="0" cy="2" r="8" fill="#c7a05f"/>
    </g>

    <!-- 목 -->
    <rect x="-26" y="108" width="52" height="42" rx="18" fill="#fbf3ee"/>

    <!-- 귀 (한쪽은 살짝 접힌 느낌) -->
    <ellipse cx="-46" cy="-160" rx="26" ry="95" fill="#fbf3ee" transform="rotate(-8 -46 -160)"/>
    <ellipse cx="-46" cy="-160" rx="13" ry="72" fill="#f4c7d3" transform="rotate(-8 -46 -160)"/>
    <ellipse cx="50" cy="-150" rx="26" ry="90" fill="#fbf3ee" transform="rotate(22 50 -150)"/>
    <ellipse cx="50" cy="-150" rx="13" ry="68" fill="#f4c7d3" transform="rotate(22 50 -150)"/>

    <!-- 얼굴 -->
    <circle cx="0" cy="20" r="108" fill="#fdfaf7"/>
    <!-- 꽃 장식 -->
    <circle cx="-58" cy="-58" r="10" fill="#e8b9c4"/>
    <circle cx="-38" cy="-72" r="8" fill="#ece3f2"/>
    <circle cx="58" cy="-58" r="9" fill="#ece3f2"/>

    <!-- 주둥이 -->
    <ellipse cx="0" cy="50" rx="46" ry="34" fill="#ffffff"/>
    <path d="M -6 44 L 0 54 L 6 44 Z" fill="#e8a7ae"/>
    <path d="M 0 56 Q -14 68 -26 60" stroke="#8a6a63" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 56 Q 14 68 26 60" stroke="#8a6a63" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- 눈 -->
    <circle cx="-32" cy="6" r="8" fill="#2b2320"/>
    <circle cx="32" cy="6" r="8" fill="#2b2320"/>
    <circle cx="-29" cy="3" r="2.2" fill="#fff"/>
    <circle cx="35" cy="3" r="2.2" fill="#fff"/>
    <!-- 속눈썹 -->
    <path d="M -40 -2 L -46 -8" stroke="#2b2320" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 40 -2 L 46 -8" stroke="#2b2320" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 볼터치 -->
    <ellipse cx="-50" cy="42" rx="15" ry="9" fill="#f0a8b4" opacity="0.6"/>
    <ellipse cx="50" cy="42" rx="15" ry="9" fill="#f0a8b4" opacity="0.6"/>
  </g>

  <!-- 가운데 하트 -->
  <g transform="translate(455,470)">
    <path d="M0 22 C -34 -6 -30 -46 -4 -46 C 8 -46 16 -38 16 -30 C 16 -38 24 -46 36 -46 C 62 -46 66 -6 32 22 L 16 34 Z"
