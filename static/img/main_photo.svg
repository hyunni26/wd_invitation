    <path d="M -70 150 C -100 220 -108 320 -100 380 L 100 380 C 108 320 100 220 70 150 Z" fill="#fdfaf7"/>
    <path d="M -70 150 C -100 220 -108 320 -100 380 L 100 380 C 108 320 100 220 70 150 Z"
