<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ecd3da"/>
      <stop offset="55%" stop-color="#e6c3cf"/>
      <stop offset="100%" stop-color="#c7b4dd"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#spot)"/>

  <!-- 은은한 별/반짝임 -->
  <g fill="#ffffff" opacity="0.55" font-family="Georgia, serif">
    <text x="150" y="220" font-size="30">✦</text>
    <text x="740" y="300" font-size="22">✦</text>
    <text x="120" y="620" font-size="18">✦</text>
    <text x="790" y="640" font-size="26">✦</text>
    <text x="230" y="980" font-size="16">✦</text>
    <text x="660" y="1000" font-size="20">✦</text>
  </g>

  <!-- 바닥 그림자 -->
  <ellipse cx="315" cy="1010" rx="130" ry="26" fill="#5c3a44" opacity="0.14"/>
  <ellipse cx="600" cy="1010" rx="120" ry="24" fill="#5c3a44" opacity="0.14"/>

  <!-- ===================== 곰돌이 신랑 ===================== -->
  <g transform="translate(315,560)">
    <!-- 팔 -->
    <ellipse cx="-95" cy="230" rx="34" ry="60" fill="#b98a68" transform="rotate(18 -95 230)"/>
    <ellipse cx="95" cy="230" rx="34" ry="60" fill="#b98a68" transform="rotate(-14 95 230)"/>

    <!-- 몸통 (연미복 느낌) -->
    <ellipse cx="0" cy="270" rx="110" ry="140" fill="#3a2f2c"/>
    <path d="M -46 160 L 0 260 L 46 160 Z" fill="#f6efe6"/>
    <!-- 보타이 -->
    <path d="M -22 150 L 0 168 L -22 186 Z" fill="#2b2320"/>
    <path d="M 22 150 L 0 168 L 22 186 Z" fill="#2b2320"/>
    <circle cx="0" cy="168" r="7" fill="#8a5a3f"/>

    <!-- 목 -->
    <rect x="-30" y="118" width="60" height="46" rx="20" fill="#c99b76"/>

    <!-- 얼굴 -->
    <circle cx="0" cy="30" r="118" fill="#c99b76"/>
    <!-- 귀 -->
    <circle cx="-92" cy="-70" r="40" fill="#c99b76"/>
    <circle cx="92" cy="-70" r="40" fill="#c99b76"/>
    <circle cx="-92" cy="-70" r="21" fill="#eccba6"/>
    <circle cx="92" cy="-70" r="21" fill="#eccba6"/>
    <!-- 주둥이 -->
    <ellipse cx="0" cy="62" rx="58" ry="42" fill="#f3e4d0"/>
    <ellipse cx="0" cy="50" rx="11" ry="9" fill="#382a24"/>
    <path d="M -12 66 Q 0 78 12 66" stroke="#5c4232" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 눈 -->
    <circle cx="-38" cy="10" r="9" fill="#2b2320"/>
    <circle cx="38" cy="10" r="9" fill="#2b2320"/>
    <circle cx="-35" cy="7" r="2.4" fill="#fff"/>
    <circle cx="41" cy="7" r="2.4" fill="#fff"/>
    <!-- 볼터치 -->
    <ellipse cx="-62" cy="46" rx="16" ry="10" fill="#e2a1a1" opacity="0.55"/>
    <ellipse cx="62" cy="46" rx="16" ry="10" fill="#e2a1a1" opacity="0.55"/>
  </g>

  <!-- ===================== 토끼 신부 ===================== -->
  <g transform="translate(600,560)">
    <!-- 베일 -->
    <path d="M 0 -170 C 110 -140 130 40 90 260 C 40 300 -40 300 -90 260 C -130 40 -110 -140 0 -170 Z"
